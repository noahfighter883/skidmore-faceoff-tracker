<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skidmore Faceoffs</title>
  <meta name="description" content="Log Skidmore hockey faceoffs live and see results by zone and opponent.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300573F'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F0B323'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="matchup" id="matchup"></div>
    <div class="bar-game" id="barGame"></div>
    <nav class="tabs" aria-label="Views">
      <button type="button" data-action="view" data-value="live">Live</button>
      <button type="button" data-action="view" data-value="full">Full stats</button>
      <button type="button" data-action="view" data-value="manage">Games and roster</button>
    </nav>
  </header>

  <p class="notice" id="notice" role="alert" hidden></p>

  <main class="view live" id="view-live">
    <section class="ice" aria-label="Log a faceoff">
      <div class="rink-wrap">
        <svg class="rink" id="rink" viewBox="-1 -1 202 87" role="group" aria-label="Rink faceoff circles"></svg>
      </div>
      <div class="entry" id="entry"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Live game stats"></aside>
  </main>

  <main class="view page" id="view-full" hidden></main>
  <main class="view page" id="view-manage" hidden></main>

  <dialog id="editDialog" aria-labelledby="editTitle">
    <form id="editForm">
      <h2 id="editTitle">Edit faceoff</h2>
      <div class="fields" id="editFields"></div>
      <div class="dialog-actions">
        <button type="button" class="danger" data-action="deleteFaceoff">Delete faceoff</button>
        <span class="spacer"></span>
        <button type="button" data-action="closeDialog" data-value="editDialog">Cancel</button>
        <button type="submit" class="primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <dialog id="textDialog" aria-labelledby="textTitle">
    <h2 id="textTitle">Text the coach</h2>
    <p class="hint" id="textScope"></p>
    <label class="visually-hidden" for="textBody">Message to the coach</label>
    <textarea id="textBody" rows="14"></textarea>
    <div class="dialog-actions">
      <span class="copy-status" id="copyStatus" role="status"></span>
      <span class="spacer"></span>
      <button type="button" data-action="closeDialog" data-value="textDialog">Close</button>
      <button type="button" class="primary" data-action="copyText" autofocus>Copy message</button>
    </div>
  </dialog>

  <dialog id="gameDialog" aria-labelledby="gameTitle">
    <form id="gameForm">
      <h2 id="gameTitle">Start a game</h2>
      <div class="fields">
        <label>Opponent <input id="gameOpponent" required autofocus autocomplete="off"></label>
        <label>Date <input id="gameDate" type="date"></label>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" data-action="closeDialog" data-value="gameDialog">Cancel</button>
        <button type="submit" class="primary" id="gameSubmit">Start game</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
